spring.application.name=sistema-medico
spring.datasource.url=jdbc:postgresql://sistemamedi.postgres.database.azure.com:5432/sistema_medico?sslmode=require
spring.datasource.username=${DB_USERNAME:sistemamedico}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.upload.dir=uploads/citas
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.port=9090

# Credenciales reales: archivo local application-local.properties (no se sube al repositorio)
spring.config.import=optional:file:./application-local.properties
