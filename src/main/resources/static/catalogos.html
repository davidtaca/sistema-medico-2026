<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogos del Sistema</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; color: #2d3748; }
        .layout { display: flex; min-height: 100vh; }
        .lateral { width: 250px; background: #2b4c7e; color: white; padding: 20px 0; flex-shrink: 0; }
        .lateral h3 { margin: 0 20px 14px; font-size: 15px; letter-spacing: .5px; opacity: .85; }
        .lateral a { display: block; padding: 10px 20px; color: #dbe7f7; text-decoration: none; font-size: 14px; border-left: 4px solid transparent; cursor: pointer; }
        .lateral a:hover { background: rgba(255,255,255,0.08); }
        .lateral a.activo { background: rgba(255,255,255,0.15); border-left-color: #90cdf4; color: white; font-weight: bold; }
        .lateral .sep { border-top: 1px solid rgba(255,255,255,0.2); margin: 12px 20px; }
        .principal { flex: 1; padding: 28px; min-width: 0; }
        .tarjeta { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 22px; }
        h2 { margin: 0 0 4px; color: #2b6cb0; }
        .nota { font-size: 13px; color: #718096; margin: 0 0 14px; }
        .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; margin: 14px 0; }
        .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .filtros label { font-size: 12px; color: #4a5568; display: block; }
        .filtros input, .filtros select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; margin-top: 3px; }
        button { padding: 8px 14px; background: #2b6cb0; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; }
        button:hover:not(:disabled) { background: #2c5282; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        button.verde { background: #2f855a; } button.verde:hover { background: #276749; }
        button.gris { background: #718096; } button.gris:hover:not(:disabled) { background: #4a5568; }
        button.rojo { background: #c53030; } button.rojo:hover { background: #9b2c2c; }
        button.chico { padding: 5px 10px; font-size: 12px; }
        .tabla-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #ebf4ff; color: #2b6cb0; text-align: left; padding: 9px 8px; white-space: nowrap; }
        td { padding: 9px 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; max-width: 280px; }
        tr:hover td { background: #f7fbff; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: bold; color: white; white-space: nowrap; }
        .badge.si { background: #2f855a; } .badge.no { background: #718096; } .badge.ctrl { background: #6b46c1; } .badge.alerta { background: #c53030; }
        .acciones { display: flex; gap: 6px; white-space: nowrap; }
        .paginacion { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 16px; font-size: 13px; color: #4a5568; }
        #mensaje { text-align: center; font-size: 14px; margin: 12px 0; min-height: 18px; }
        .error { color: #c53030; } .exito { color: #2f855a; font-weight: bold; } .vacio { color: #718096; }
        .fondo { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .modal { background: white; border-radius: 10px; padding: 22px; width: 470px; max-width: 100%; max-height: 92vh; overflow-y: auto; }
        .modal h3 { margin: 0 0 4px; color: #2b6cb0; }
        .modal label { display: block; font-size: 13px; margin-top: 12px; }
        .modal .req { color: #c53030; }
        .modal input[type=text], .modal input[type=number], .modal select, .modal textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; font-size: 13px; }
        .modal textarea { min-height: 70px; resize: vertical; }
        .modal .invalido { border-color: #c53030 !important; background: #fff5f5; }
        .modal .check { display: flex; align-items: center; gap: 8px; }
        .modal .check input { width: auto; margin: 0; }
        .modal input:disabled, .modal select:disabled { background: #edf2f7; color: #4a5568; }
        .modal .errorForm { color: #c53030; font-size: 13px; margin-top: 12px; min-height: 16px; }
        .modal .acc { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
        .oculto { display: none !important; }
        a.salir { display: block; text-align: center; margin-top: 18px; color: #718096; font-size: 13px; }
        @media (max-width: 800px) { .layout { flex-direction: column; } .lateral { width: 100%; } }
    </style>
</head>
<body>
<div class="layout">
    <nav class="lateral">
        <h3>CATÁLOGOS</h3>
        <div id="menu"></div>
        <div class="sep"></div>
        <a href="/especialidades-sede.html">Sucursal-Especialidad</a>
        <a href="/menu.html">← Volver al menú</a>
    </nav>

    <main class="principal">
        <div class="tarjeta">
            <h2 id="titulo">Catálogos</h2>
            <p class="nota" id="nota"></p>

            <div class="barra">
                <div class="filtros">
                    <div><label for="fTexto">Buscar</label><input type="text" id="fTexto" maxlength="100" placeholder="Nombre u otro dato"></div>
                    <div><label for="fEstado">Estado</label>
                        <select id="fEstado"><option value="">Todos</option><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></div>
                    <button onclick="buscar()">Buscar</button>
                    <button class="gris" onclick="limpiar()">Limpiar</button>
                </div>
                <button class="verde" onclick="abrirForm()">Crear</button>
            </div>

            <div id="mensaje"></div>
            <div class="tabla-scroll"><table><thead id="cabecera"></thead><tbody id="cuerpo"></tbody></table></div>

            <div class="paginacion">
                <button class="gris" id="btnAnterior" onclick="cambiarPagina(-1)">‹ Anterior</button>
                <span id="infoPagina"></span>
                <button class="gris" id="btnSiguiente" onclick="cambiarPagina(1)">Siguiente ›</button>
            </div>
        </div>
    </main>
</div>

<!-- Formulario de creación / edición -->
<div class="fondo oculto" id="fondoForm">
    <div class="modal">
        <h3 id="tituloForm"></h3>
        <form id="formulario" onsubmit="return false;"></form>
        <div class="errorForm" id="errorForm"></div>
        <div class="acc">
            <button class="gris" onclick="cerrarForm()">Cancelar</button>
            <button class="verde" id="btnGuardar" onclick="guardar()">Crear</button>
        </div>
    </div>
</div>

<!-- Confirmación de eliminación -->
<div class="fondo oculto" id="fondoEliminar">
    <div class="modal" style="width:400px;text-align:center;">
        <p id="textoEliminar" style="font-size:15px;margin-top:0;"></p>
        <div class="acc" style="justify-content:center;">
            <button class="gris" onclick="cerrarEliminar()">Cancelar</button>
            <button class="rojo" onclick="confirmarEliminar()">Eliminar</button>
        </div>
    </div>
</div>

<script>
    const usuario = JSON.parse(sessionStorage.getItem('usuarioActual') || 'null');
    if (!usuario || usuario.rol !== 'ADMINISTRADOR') {
        alert('Debe iniciar sesión como administrador.');
        window.location.href = '/index.html';
    }

    const TAMANO = 10;
    let clave = null, esquema = null, pagina = 0, totalPaginas = 0;
    let editandoId = null, pendienteEliminar = null;
    const mensaje = document.getElementById('mensaje');

    function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
    function aviso(texto, clase) { mensaje.textContent = texto; mensaje.className = clase || ''; }

    // ---------------------------------------------------------------- menú lateral y catálogo
    async function iniciar() {
        const catalogos = await fetch('/api/catalogos').then(r => r.json());
        const pedido = new URLSearchParams(window.location.search).get('catalogo');
        clave = catalogos.some(c => c.clave === pedido) ? pedido : catalogos[0].clave;
        document.getElementById('menu').innerHTML = catalogos.map(c =>
            `<a id="m-${c.clave}" onclick="elegirCatalogo('${c.clave}')">${esc(c.titulo)}</a>`).join('');
        await cargarCatalogo();
    }

    async function elegirCatalogo(c) {
        clave = c; pagina = 0;
        document.getElementById('fTexto').value = ''; document.getElementById('fEstado').value = '';
        history.replaceState(null, '', '?catalogo=' + c);
        aviso('');
        await cargarCatalogo();
    }

    async function cargarCatalogo() {
        document.querySelectorAll('.lateral a').forEach(a => a.classList.toggle('activo', a.id === 'm-' + clave));
        esquema = await fetch(`/api/catalogos/${clave}/esquema`).then(r => r.json());
        document.getElementById('titulo').textContent = esquema.titulo;
        document.getElementById('nota').textContent = esquema.nota || '';
        document.getElementById('cabecera').innerHTML = '<tr><th>ID</th>' + esquema.columnas.map(c => `<th>${esc(c.etiqueta)}</th>`).join('') + '<th>Estado</th><th>Acciones</th></tr>';
        await cargar();
    }

    // ---------------------------------------------------------------- listado (paso 2)
    function celda(campo, valor, fila) {
        if (campo === 'controlado') return valor ? '<span class="badge ctrl">Controlado</span>' : '—';
        if (campo === 'alerta') return valor ? `<span class="badge alerta" title="${esc(fila.alertaMensaje)}">${esc(valor)}</span>` : '—';
        if (valor === null || valor === undefined || valor === '') return '—';
        return esc(valor);
    }

    async function cargar() {
        const params = new URLSearchParams({ q: document.getElementById('fTexto').value.trim(), estado: document.getElementById('fEstado').value, pagina, tamano: TAMANO });
        const r = await fetch(`/api/catalogos/${clave}?` + params);
        const datos = await r.json();
        if (!r.ok) { aviso(datos.error, 'error'); return; }
        totalPaginas = datos.totalPaginas;
        const cols = esquema.columnas.length + 3;
        document.getElementById('cuerpo').innerHTML = datos.contenido.length === 0
            ? `<tr><td colspan="${cols}" class="vacio" style="text-align:center;padding:24px;">No se encontraron resultados.</td></tr>`
            : datos.contenido.map(f => `<tr><td>${f.id}</td>` +
                esquema.columnas.map(c => `<td>${celda(c.campo, f[c.campo], f)}</td>`).join('') +
                `<td><span class="badge ${f.activo ? 'si' : 'no'}">${f.activo ? 'Activo' : 'Inactivo'}</span></td>
                 <td><div class="acciones"><button class="chico" onclick="abrirForm(${f.id})">Editar</button>
                 ${clave === 'inventario' ? `<button class="chico gris" onclick="window.location.href='/bitacora-inventario.html?medicamentoId=${f.medicamentoId}&sucursalId=${f.sucursalId}'">Bitácora</button>` : ''}
                 <button class="chico rojo" ${f.activo ? '' : 'disabled'} onclick="pedirEliminar(${f.id}, this)" data-nombre="${esc(f.nombre)}">Eliminar</button></div></td></tr>`).join('');
        document.getElementById('infoPagina').textContent = totalPaginas === 0 ? 'Sin resultados' : `Página ${pagina + 1} de ${totalPaginas} (${datos.totalElementos} registros)`;
        document.getElementById('btnAnterior').disabled = pagina <= 0;
        document.getElementById('btnSiguiente').disabled = pagina + 1 >= totalPaginas;
    }

    function buscar() { pagina = 0; aviso(''); cargar(); }
    function limpiar() { document.getElementById('fTexto').value = ''; document.getElementById('fEstado').value = ''; buscar(); }
    function cambiarPagina(d) { pagina += d; cargar(); }
    document.getElementById('fTexto').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

    // ---------------------------------------------------------------- formulario (pasos 3 a 8, FA02, FA04, FA05)
    async function abrirForm(id) {
        editandoId = id || null;
        let valores = {};
        if (editandoId) {
            const r = await fetch(`/api/catalogos/${clave}/${editandoId}`);
            valores = await r.json();
            if (!r.ok) { aviso(valores.error, 'error'); return; }
        }
        let html = '';
        for (const c of esquema.campos) {
            const v = valores[c.nombre];
            const bloqueado = editandoId && c.soloCreacion ? 'disabled' : '';
            const req = c.obligatorio ? ' <span class="req">*</span>' : '';
            const max = c.max ? `maxlength="${c.max}"` : '';
            if (c.tipo === 'area') html += `<label>${esc(c.etiqueta)}${req}<textarea id="c-${c.nombre}" ${max}>${esc(v)}</textarea></label>`;
            else if (c.tipo === 'booleano') html += `<label class="check"><input type="checkbox" id="c-${c.nombre}" ${v ? 'checked' : ''}> ${esc(c.etiqueta)}</label>`;
            else if (c.tipo === 'seleccion') html += `<label>${esc(c.etiqueta)}${req}<select id="c-${c.nombre}" ${bloqueado}><option value="">Seleccione...</option></select></label>`;
            else if (c.tipo === 'decimal') html += `<label>${esc(c.etiqueta)}${req}<input type="number" step="0.01" min="0" id="c-${c.nombre}" value="${esc(v)}"></label>`;
            else if (c.tipo === 'entero') html += `<label>${esc(c.etiqueta)}${req}<input type="number" step="1" min="0" id="c-${c.nombre}" value="${esc(v)}"></label>`;
            else html += `<label>${esc(c.etiqueta)}${req}<input type="text" id="c-${c.nombre}" ${max} value="${esc(v)}"></label>`;
        }
        html += `<label>Estado <span class="req">*</span><select id="c-activo"><option value="true">Activo</option><option value="false">Inactivo</option></select></label>`;
        document.getElementById('formulario').innerHTML = html;
        document.getElementById('c-activo').value = editandoId ? String(valores.activo) : 'true';
        for (const c of esquema.campos.filter(c => c.tipo === 'seleccion')) {
            const opciones = await fetch(`/api/catalogos/${clave}/opciones?campo=${c.nombre}`).then(r => r.json());
            const sel = document.getElementById('c-' + c.nombre);
            opciones.forEach(o => sel.add(new Option(o.etiqueta, o.id)));
            if (valores[c.nombre] != null) sel.value = String(valores[c.nombre]);
        }
        document.getElementById('tituloForm').textContent = (editandoId ? 'Editar' : 'Crear') + ' — ' + esquema.titulo;
        document.getElementById('btnGuardar').textContent = editandoId ? 'Actualizar' : 'Crear';
        document.getElementById('errorForm').textContent = '';
        document.getElementById('fondoForm').classList.remove('oculto');
    }

    // FA04
    function cerrarForm() { document.getElementById('fondoForm').classList.add('oculto'); }

    // Marca en rojo los campos cuyo nombre aparece en el mensaje de error del servidor (FA05)
    const sinTildes = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    function resaltarCampos(error) {
        const m = sinTildes(error);
        document.querySelectorAll('#formulario .invalido').forEach(e => e.classList.remove('invalido'));
        esquema.campos.filter(c => c.tipo !== 'booleano').forEach(c => {
            const palabras = [c.nombre.replace(/Id$/, ''), c.etiqueta.split(' ')[0]];
            if (palabras.some(p => m.includes(sinTildes(p)))) {
                const el = document.getElementById('c-' + c.nombre);
                if (el) el.classList.add('invalido');
            }
        });
    }

    async function guardar() {
        const cuerpo = { adminId: usuario.id, activo: document.getElementById('c-activo').value };
        esquema.campos.forEach(c => {
            const el = document.getElementById('c-' + c.nombre);
            cuerpo[c.nombre] = c.tipo === 'booleano' ? el.checked : el.value;
        });
        const r = await fetch(editandoId ? `/api/catalogos/${clave}/${editandoId}` : `/api/catalogos/${clave}`,
            { method: editandoId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
        const datos = await r.json();
        if (!r.ok) {
            document.getElementById('errorForm').textContent = datos.error;
            resaltarCampos(datos.error);
            return;
        }
        cerrarForm();
        aviso(datos.mensaje, 'exito');
        await cargar();
    }

    // ---------------------------------------------------------------- eliminar (FA03)
    function pedirEliminar(id, boton) {
        pendienteEliminar = id;
        document.getElementById('textoEliminar').textContent = `¿Está seguro que desea eliminar el registro ${boton.dataset.nombre}? Esta acción no se puede deshacer.`;
        document.getElementById('fondoEliminar').classList.remove('oculto');
    }
    function cerrarEliminar() { pendienteEliminar = null; document.getElementById('fondoEliminar').classList.add('oculto'); }
    async function confirmarEliminar() {
        const id = pendienteEliminar;
        cerrarEliminar();
        const r = await fetch(`/api/catalogos/${clave}/${id}?adminId=${usuario.id}`, { method: 'DELETE' });
        const datos = await r.json();
        aviso(r.ok ? datos.mensaje : datos.error, r.ok ? 'exito' : 'error');
        await cargar();
    }

    iniciar();
</script>
<script src="/sesion.js"></script>
</body>
</html>
